appId: com.klaudjo.notepad
productName: Digital Notepad
# Match the lockfile: electron-builder cannot infer this from hoisted dependencies.
electronVersion: 45.2.3
directories:
  output: ../../release
  buildResources: build
files:
  - dist/**/*
  - main.js
  - preload.js
  - window-state.js
  - startup-error.html
  - startup-error.js
  - build/icon.svg
  - build/icon.png
  - build/icon.ico
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  runAfterFinish: false
  artifactName: Digital Notepad-Setup-${version}.${ext}
portable:
  artifactName: Digital Notepad-Portable-${version}.${ext}
